name: News to Telegram

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут (время UTC)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python bot.py

      - name: Save list of posted news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen.json"
          git push
